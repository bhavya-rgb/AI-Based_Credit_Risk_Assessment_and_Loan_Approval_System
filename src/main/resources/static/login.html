<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Credit Risk System</title>
  <link rel="stylesheet" href="/css/app.css" />

  <style>
    /* 🔥 TOP LEFT IMAGE */
    .page-logo {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 200px;
      height: auto;
      border-radius: 18px;
      box-shadow: 0 12px 20px rgba(0,0,0,0.4);
      z-index: 1000;
    }
  </style>
</head>

<body class="auth-shell">
  <main class="auth-card">

    <!-- 🔥 LEFT SIDE WITH BACKGROUND IMAGE -->
    <div class="brand-block" style="
      background: linear-gradient(
          rgba(0,0,0,0.45),
          rgba(0,0,0,0.45)
        ),
        url('https://static.vecteezy.com/system/resources/thumbnails/024/269/311/small/car-house-personal-money-loan-concept-finance-business-icon-on-wooden-cube-saving-money-for-a-car-money-and-house-wooden-cubes-with-word-loan-copy-space-for-text-loan-payment-car-and-house-photo.jpg');
      background-size: cover;
      background-position: center;
      border-radius: 16px;
      padding: 30px;
      color: white;
    ">
      <p class="eyebrow" style="color:#fcd34d;">AI Loan Approval</p><br>

      <h1 style="color:white; text-shadow:2px 2px 8px rgba(0,0,0,0.7);">
        Credit Risk Assessment Console
      </h1>

      <p class="muted" style="color:#e5e7eb;">
        Spring Boot + MySQL full-stack system with paper-aligned risk pipeline scaffolding.
      </p>
    </div>

    <!-- RIGHT SIDE LOGIN -->
    <form id="loginForm" class="panel stack">
      <label>Email
        <input name="email" type="email" value="admin@creditrisk.local" required />
      </label>

      <label>Password
        <input name="password" type="password" value="Admin@123" required />
      </label>

      <button type="submit" class="btn btn-primary">Login</button>

      <p id="loginError" class="error"></p>

      <p class="hint">
        Seeded admin (dev):
        <code>admin@creditrisk.local / Admin@123</code>
      </p>
    </form>

  </main>

  <script type="module" src="/js/login.js"></script>

</body>
</html>
